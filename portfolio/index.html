<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madhav Sharma | 3D Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Essential styles to prevent flickering */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    </style>
</head>
<body>

    <div id="ui-layer" style="position: relative; z-index: 10;">
        
        <nav style="display: flex; justify-content: space-between; padding: 30px; font-family: sans-serif; letter-spacing: 2px;">
            <div class="logo" style="font-weight: bold; color: white;">MS.DESIGN</div>
            <div class="nav-links" style="color: rgba(255,255,255,0.6); font-size: 14px;">
                <span style="margin-left: 20px;">WORK</span>
                <span style="margin-left: 20px;">CONTACT</span>
            </div>
        </nav>

        <div class="hero-section" style="position: fixed; bottom: 60px; left: 50px; pointer-events: none;">
            <h1 style="color: white; font-size: clamp(3rem, 10vw, 6rem); margin: 0; font-family: sans-serif; font-weight: 900; line-height: 0.8;">
                MADHAV<br>SHARMA
            </h1>
            <p style="color: #00ffcc; font-family: sans-serif; margin-top: 15px; letter-spacing: 3px; font-size: 0.9rem;">
                WEB DESIGNER | OPTIMIST | BASKETBALL ENTHUSIAST
            </p>
        </div>

        <div id="info-sidebar" class="sidebar">
            <button class="close-btn" onclick="closeSidebar()" style="cursor: pointer;">&times;</button>
            <div id="sidebar-content">
                <h2 id="side-title" style="font-family: sans-serif; font-size: 2rem; color: #00ffcc;">Section</h2>
                <div style="width: 40px; height: 3px; background: white; margin: 20px 0;"></div>
                <p id="side-desc" style="font-family: sans-serif; line-height: 1.6; color: #ccc; font-size: 1.1rem;">
                    Description content...
                </p>
            </div>
        </div>

    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="script.js"></script>

</body>
</html>
